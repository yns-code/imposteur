<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>L'Imposteur</title><style>
:root{--bg:#15102b;--card:#282047;--text:#faf7ff;--muted:#c7bfd9;--gold:#ffb53d;--red:#ec6170;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 90% 0,#402b70,transparent 38%),var(--bg)}button,input{font:inherit}button{border:0;min-height:54px;border-radius:16px;font-weight:800;font-size:1rem;cursor:pointer}button:active{transform:scale(.98)}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}.app{width:min(100%,560px);min-height:100dvh;margin:auto;padding:max(22px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{margin-bottom:26px}.logo{background:none;color:var(--text);padding:0;min-height:30px}.logo b{color:var(--gold)}.hero,.center{margin:auto 0;text-align:center}.hero{text-align:left}.orb{display:grid;place-items:center;width:78px;height:78px;margin-bottom:22px;border-radius:50%;background:var(--gold);color:var(--bg);font-size:3rem;font-weight:950}.center .orb{margin:0 auto 22px}h1{margin:0 0 15px;font-size:clamp(2.35rem,12vw,4.3rem);line-height:1.02;letter-spacing:-.06em}.eyebrow,.round{margin:0 0 9px;color:var(--gold);font-size:.75rem;font-weight:900;letter-spacing:.11em;text-transform:uppercase}.lead{margin:0 0 27px;color:var(--muted);line-height:1.5}.stack{display:grid;gap:11px}.primary{background:var(--gold);color:#1c1531}.secondary{background:var(--card);color:var(--text)}.danger{background:var(--red);color:#fff}form{display:grid;gap:22px;text-align:left}label{display:grid;gap:8px;font-weight:750}input{border:1px solid #514671;border-radius:13px;padding:13px;background:var(--card);color:var(--text)}input[type=range]{padding:0;accent-color:var(--gold)}.names{display:grid;gap:9px;max-height:38dvh;overflow:auto}.names label{grid-template-columns:90px 1fr;align-items:center;font-size:.86rem}.avatar{display:grid;place-items:center;width:72px;height:72px;margin:20px auto;border-radius:26px;background:var(--card);color:var(--gold);font-size:1.7rem;font-weight:900}.word{margin:25px 0;color:var(--gold);font-size:clamp(2.8rem,15vw,5rem);font-weight:950;letter-spacing:-.06em;overflow-wrap:anywhere}.notice{margin:24px 0;padding:20px;border-radius:18px;background:var(--card);text-align:left;line-height:1.5;color:var(--muted)}.notice b{color:var(--text)}.words{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:25px 0;text-align:left}.words div{padding:15px;border-radius:15px;background:var(--card)}.words span{display:block;margin-bottom:7px;color:var(--muted);font-size:.75rem}.words b{font-size:1.05rem;overflow-wrap:anywhere}@media(max-height:680px){.top{margin-bottom:15px}.orb{width:55px;height:55px;margin-bottom:14px;font-size:2rem}.names{max-height:25dvh}}
</style></head><body><main class="app" id="app"></main><script>
(()=>{const pairs=[['Lion','Tigre'],['Chat','Lynx'],['Chien','Loup'],['Dauphin','Requin'],['Pizza','Burger'],['Sushi','Maki'],['Tacos','Kebab'],['Crêpe','Gaufre'],['Football','Rugby'],['Tennis','Badminton'],['Basket','Handball'],['Avion','Hélicoptère'],['Train','Métro'],['Hôtel','Camping'],['Plage','Piscine'],['Montagne','Volcan'],['Forêt','Jungle'],['Téléphone','Tablette'],['Ordinateur','Console'],['Casque','Écouteurs'],['Canapé','Fauteuil'],['Four','Micro-ondes'],['Harry Potter','Seigneur des Anneaux'],['Star Wars','Star Trek'],['Guitare','Basse'],['Piano','Clavier'],['Stylo','Crayon'],['Dessin','Peinture'],['Voiture','Moto'],['Bateau','Voilier'],['Soleil','Étoile'],['Fusée','Navette']],app=document.querySelector('#app');let game,history;try{history=JSON.parse(localStorage.getItem('imposteur-history')||'[]')}catch{history=[]}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rand=n=>{try{let x=new Uint32Array(1);crypto.getRandomValues(x);return x[0]%n}catch{return Math.floor(Math.random()*n)}},button=(text,action,kind='primary')=>`<button class="${kind}" data-action="${action}">${text}</button>`,shell=html=>`<div class="top"><button class="logo" data-action="home"><b>◉</b> L’Imposteur</button></div>${html}`,put=html=>{app.innerHTML=html;app.querySelectorAll('[data-action]').forEach(b=>b.onclick=act)};
function home(){game={page:'home'};put(shell(`<section class="hero"><div class="orb">?</div><p class="eyebrow">Le jeu de mots à suspicion</p><h1>Qui joue<br>double jeu ?</h1><p class="lead">Un téléphone, des indices et un imposteur à démasquer.</p><div class="stack">${button('Nouvelle partie','setup')}${button('Comment jouer ?','rules','secondary')}</div></section>`))}
function setup(){game={page:'setup',players:game?.players||['Joueur 1','Joueur 2','Joueur 3','Joueur 4']};put(shell(`<h1>Préparez<br>la partie</h1><p class="lead">Ajoutez les prénoms, puis commencez.</p><form id="form"><label>Nombre de joueurs<input id="count" type="range" min="3" max="12" value="${game.players.length}"></label><div class="names" id="names">${nameFields()}</div>${button('Commencer','start')}</form>`));document.querySelector('#count').oninput=e=>{const old=[...document.querySelectorAll('#names input')].map(x=>x.value);game.players=Array.from({length:+e.target.value},(_,i)=>old[i]||`Joueur ${i+1}`);document.querySelector('#names').innerHTML=nameFields()};document.querySelector('#form').onsubmit=e=>{e.preventDefault();start()}}
function nameFields(){return game.players.map((p,i)=>`<label>Joueur ${i+1}<input maxlength="18" value="${esc(p)}"></label>`).join('')}
function start(){const p=[...document.querySelectorAll('#names input')].map((x,i)=>x.value.trim()||`Joueur ${i+1}`);if(new Set(p.map(x=>x.toLowerCase())).size!==p.length)return alert('Chaque joueur doit avoir un nom différent.');game.players=p;game.round=1;nextRound()}
function nextRound(){let choices=pairs.map((pair,id)=>({pair,id})).filter(x=>!history.includes(x.id));if(!choices.length){history=[];choices=pairs.map((pair,id)=>({pair,id}))}const selected=choices[rand(choices.length)];history.push(selected.id);try{localStorage.setItem('imposteur-history',JSON.stringify(history))}catch{}game.pair=selected.pair;game.impostor=rand(game.players.length);game.words=game.players.map((_,i)=>i===game.impostor?selected.pair[1]:selected.pair[0]);game.index=0;game.page='pass';render()}
function pass(){const player=game.players[game.index];put(shell(`<section class="center"><p class="round">Manche ${game.round} · ${game.index+1}/${game.players.length}</p><div class="avatar">${game.index+1}</div><h1>${esc(player)}</h1><p class="lead">Prends le téléphone et regarde ton mot seul.</p>${button('Voir mon mot','show')}</section>`))}
function word(){put(shell(`<section class="center"><p class="round">Ton mot secret</p><div class="word">${esc(game.words[game.index])}</div><p class="lead">Ne le montre à personne.</p>${button('Cacher mon mot','hide','danger')}</section>`))}
function discuss(){put(shell(`<section class="center"><p class="round">Manche ${game.round}</p><h1>Discutez<br>entre vous.</h1><div class="notice"><b>Chacun donne un indice d’un seul mot, à voix haute.</b><br><br>L’ordre est libre : l’application ne dit pas quel joueur doit parler ni contre qui voter.</div><p class="lead">Votez ensemble à l’oral, puis découvrez les mots.</p>${button('Voir les mots de la manche','result')}</section>`))}
function result(){put(shell(`<section class="center"><p class="round">Les mots de la manche</p><h1>Révélation</h1><div class="words"><div><span>Mot commun</span><b>${esc(game.pair[0])}</b></div><div><span>Mot différent</span><b>${esc(game.pair[1])}</b></div></div><p class="lead">Discutez du résultat entre vous.</p><div class="stack">${button('Manche suivante','next')}${button('Nouvelle partie','setup','secondary')}</div></section>`))}
function rules(){put(shell(`<section class="center"><h1>Comment jouer ?</h1><div class="notice"><b>1.</b> Chacun regarde son mot secrètement.<br><br><b>2.</b> Un joueur reçoit un mot proche : c’est l’Imposteur.<br><br><b>3.</b> Donnez vos indices, puis votez à l’oral.<br><br><b>4.</b> Découvrez les mots et relancez une manche.</div>${button('Nouvelle partie','setup')}</section>`))}
function act(e){const a=e.currentTarget.dataset.action;if(a==='home')home();else if(a==='setup')setup();else if(a==='rules')rules();else if(a==='start')start();else if(a==='show'){game.page='word';render()}else if(a==='hide'){game.index++;game.page=game.index===game.players.length?'discuss':'pass';render()}else if(a==='result')result();else if(a==='next'){game.round++;nextRound()}}
function render(){if(game.page==='pass')pass();else if(game.page==='word')word();else if(game.page==='discuss')discuss()}home()})();
</script></body></html>
